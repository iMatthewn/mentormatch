spring.application.name=mentormatch
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mentormatch-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8

jwt.secret=${JWT_SECRET:2bb80d537b1da3e38bd30361aa855686bde0eacd7162fef6a25fe97bf527a25b}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:3600000}
